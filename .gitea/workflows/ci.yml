name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same constraint the dev dependency group declares, so CI and a local
      # checkout resolve the same ruff. Rule selection comes from pyproject
      # only; nothing is selected or ignored here.
      - name: Install ruff
        run: python -m pip install "ruff>=0.15.21"

      # ``scripts`` is included so the release tooling is held to the same rules
      # as the package. The pre-commit hooks lint by filename and would cover it
      # either way; listing it here keeps the two from diverging.
      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format --check
        run: ruff format --check src tests scripts

  changelog:
    # Only meaningful for a pull request, where a base branch exists to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed src/ requires a CHANGELOG entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed" | sed 's/^/  /'

          case "$PR_TITLE" in
            *"[skip changelog]"*)
              echo "PR title carries [skip changelog]; not requiring an entry."
              exit 0
              ;;
          esac

          if ! echo "$changed" | grep -q '^src/'; then
            echo "No src/ change; CHANGELOG entry not required."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "src/ changed and CHANGELOG.md was updated."
            exit 0
          fi

          echo
          echo "This pull request changes src/ but does not touch CHANGELOG.md."
          echo "CHANGELOG.md requires every user-facing change to update the"
          echo "unreleased section in the same pull request. If this really is a"
          echo "pure internal refactor with no effect on users, add"
          echo "'[skip changelog]' to the pull request title."
          exit 1
