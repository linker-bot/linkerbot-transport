name: MiniCANFD ABI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vendor-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[canfd]" pytest pytest-timeout
      - name: Vendor ABI and lifecycle tests without hardware
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_timeout --timeout=60 tests/comm/canfd
