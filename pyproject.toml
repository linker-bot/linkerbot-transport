[project]
name = "linkerbot-transport"
version = "0.1.3"
description = "Transport and concurrency primitives for Linkerbot device SDKs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Linkerbot" }]
dependencies = []

[project.optional-dependencies]
can = ["python-can>=4.6.1"]
canfd = ["python-can>=4.6.1"]
all = ["python-can>=4.6.1"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "build>=1.3.0",
  "pytest>=9.1.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.15.21",
  "ty>=0.0.58",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "linkerbot_transport*",
  "linkerbot.comm*",
  "linkerbot.exceptions*",
  "linkerbot.queue*",
  "linkerbot.relay*",
]
namespaces = true

[tool.setuptools.package-data]
linkerbot_transport = ["py.typed"]
"linkerbot.comm" = ["py.typed"]
"linkerbot.exceptions" = ["py.typed"]
"linkerbot.queue" = ["py.typed"]
"linkerbot.relay" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["canfd: Tests for CAN FD communication"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["linkerbot", "linkerbot_transport"]
